name: Travel assistant tests
on:
  push:
    paths:
      - 'travel-reimbursement-assistant/**'
      - '.github/workflows/travel-assistant-ci.yml'
  pull_request:
    paths:
      - 'travel-reimbursement-assistant/**'
      - '.github/workflows/travel-assistant-ci.yml'
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: travel-reimbursement-assistant
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python examples/demo.py
      - run: python -m pip install --no-deps .
      - run: travel-assistant check data/claim.json --policies config/policies.json
      - run: python scripts/build.py
