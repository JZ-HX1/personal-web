# Standalone-repository workflow. In personal-web, the active workflow is
# /.github/workflows/travel-assistant-ci.yml (GitHub only discovers root workflows).
name: Standalone travel assistant tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: python examples/demo.py
      - run: python -m pip install --no-deps .
      - run: travel-assistant check data/claim.json --policies config/policies.json
